# Optional SearXNG search service for web_search. Start it next to Vex with:
#   docker-compose -f compose.yaml -f compose.searxng.yaml up -d
# then set, in the WebChat settings or config.yaml:
#   webSearch: { provider: searxng, baseUrl: "http://searxng:8080" }
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-this-local-secret}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml

configs:
  searxng-settings:
    content: |
      use_default_settings: true
      server:
        secret_key: "${SEARXNG_SECRET:-change-this-local-secret}"
        limiter: false
        image_proxy: false
      search:
        formats:
          - html
          - json
