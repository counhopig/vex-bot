<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vex</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="brand">Vex</span>
        <button id="new-session" type="button">新对话</button>
      </div>
      <ul id="session-list"></ul>
      <button id="open-settings" type="button" class="link">设置</button>
    </aside>
    <main id="main">
      <div id="status" hidden></div>
      <section id="approvals"></section>
      <section id="chat">
        <div id="messages"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="stop" type="button" class="secondary" hidden>停止</button>
          <button id="send" type="submit">发送</button>
        </form>
      </section>
      <section id="settings" hidden>
        <div class="settings-head">
          <h2>设置</h2>
          <button id="close-settings" type="button" class="link">返回</button>
        </div>
        <select id="settings-file">
          <option value="config.yaml">config.yaml · 配置</option>
          <option value="SOUL.md">SOUL.md · 人设</option>
          <option value="USER.md">USER.md · 关于我</option>
          <option value="MEMORY.md">MEMORY.md · 长期记忆</option>
          <option value="HEARTBEAT.md">HEARTBEAT.md · 心跳清单</option>
        </select>
        <p id="settings-hint" class="hint"></p>
        <textarea id="settings-text" spellcheck="false"></textarea>
        <div class="settings-actions">
          <button id="save-settings" type="button">保存</button>
          <span id="settings-result"></span>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
