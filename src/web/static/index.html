<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Vex</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    try {
      const mode = localStorage.getItem("vex.theme");
      if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
    } catch {
      // Storage can be unavailable in private windows.
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="scrim" hidden></div>
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="brand">
          <svg class="vex-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path class="portal-frame" d="M29 4H18L4 18V29H10V21L21 10H29ZM35 4H46L60 18V29H54V21L43 10H35ZM60 35V46L46 60H35V54H43L54 43V35ZM29 60H18L4 46V35H10V43L21 54H29Z"/>
            <path class="portal-depth" d="M21 10L25 18M43 10L39 18M54 21L46 25M54 43L46 39M43 54L39 46M21 54L25 46M10 43L18 39M10 21L18 25"/>
            <path class="portal-aperture" d="M25 18H39L46 25V39L39 46H25L18 39V25Z"/>
            <path class="portal-threshold" d="M27 25H37L39 27V37L37 39H27L25 37V27Z"/>
          </svg>
          <span>Vex</span>
        </span>
        <button id="new-session" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
      </div>
      <ul id="session-list"></ul>
      <div class="sidebar-foot">
        <button id="open-settings" type="button" class="link">Settings</button>
        <button id="theme" type="button" class="link" aria-label="Switch theme">System</button>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <button id="menu" type="button" class="icon" aria-label="Conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span id="topbar-title">Vex</span>
        <button id="topbar-new" type="button" class="icon" aria-label="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </header>
      <div id="status" role="status" hidden></div>
      <section id="approvals"></section>
      <section id="chat">
        <div id="messages"></div>
        <div id="statusline"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="Say something…" aria-label="Message" enterkeyhint="send"></textarea>
          <button id="stop" type="button" class="secondary" hidden>Stop</button>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
      <section id="settings" hidden>
        <div class="settings-head">
          <h2>Settings</h2>
          <button id="close-settings" type="button" class="link">Back</button>
        </div>
        <nav id="settings-tabs" role="tablist"></nav>
        <div id="settings-body">
          <div id="settings-form"></div>
          <div id="schedule-list" hidden></div>
          <div id="settings-editor" hidden>
            <div id="file-tabs" role="tablist"></div>
            <div id="file-editors"></div>
            <p id="settings-hint" class="hint"></p>
            <textarea id="settings-text" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="settings-actions">
          <button id="save-settings" type="button">Save</button>
          <span id="settings-result" role="status"></span>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
